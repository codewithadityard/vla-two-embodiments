# P3: Meta-World MT10 (second embodiment). Pins only; model and training settings come from configs/base.yaml.
data:
  repo_id: lerobot/metaworld_mt50
  revision: b46a1c185a2368660650a82ac5a5083a56722f48  # Hub commit, 2026-09-24
  # Kaggle copies (gitignored)
  meta_dir: data/metaworld_mt50_meta
  lowdim_path: data/metaworld_mt50_lowdim.parquet
  sample_path: data/metaworld_mt50_sample.parquet
  # MT10 = metaworld.MT10() train classes (read on Kaggle from the installed metaworld, not typed here)

# Reference policy whose eval settings we copy (approved 2026-11-28). n_action_steps is fixed before any eval,
# from this pinned config, and is never changed based on eval results.
