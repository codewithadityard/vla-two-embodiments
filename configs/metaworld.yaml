  revision: 8d82bdf3487776404e5e863f585c9d5210b96d14  # Hub commit, 2026-10-12
  n_action_steps: 50  # config.json at the revision above (chunk_size 50); re-read and checked by data_report_mw

# LeRobot's Meta-World integration at the pinned LeRobot commit (b07adcc, notebooks/00_feasibility.ipynb)
lerobot_commit: b07adcc5e3ce42c26a248236dbb3571f84c28c43

split:
  split_seed: 0
  val_fraction: 0.1  # per task, by episode; at least 1 val episode per task (same rule as LIBERO)
