# Shared settings for every run. Run files in configs/runs/ inherit from this.

data:
  repo_id: lerobot/libero_goal_image
  revision: 91a97115558b5b611200a432d9c82e4f30991b60  # Hub commit, 2026-03-09
  # Laptop copies (gitignored). Images are never fully downloaded on the laptop.
  meta_dir: data/libero_goal_meta                     # meta/ files only
  lowdim_path: data/libero_goal_lowdim.parquet        # non-image columns, read from the Hub
  sample_path: data/libero_goal_sample.parquet        # all columns, sample episodes only
  sample_episodes: [0, 1]
  # Only meta/ is downloaded; used to compare with the dataset smolvla_libero trained on.
  reference_repo_id: HuggingFaceVLA/libero
  reference_revision: 86958911c0f959db2bbbdb107eb3e17c5f9c798e  # Hub commit, 2025-09-30
  reference_meta_dir: data/hf_vla_libero_meta

split:
  split_seed: 0
  val_fraction: 0.1  # per task, by episode; at least 1 val episode per task

seed: 0  # run-level randomness (probe frame choice, init, data order, noise)

backbone:
  name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  revision: 4cde9d208e19519c36917aa170fffc7e381aa0ad  # Hub commit, 2026-11-13
  num_layers: 16  # first half of 32 LM layers, as lerobot/smolvla_base (num_vlm_layers: 16)

cache:
  max_gb: 15        # SPEC limit
  dir: outputs/cache

env:
  suite: libero_goal

# ---- M3-M6 (values from docs/IMPLEMENTATION_PLAN.md; SmolVLA presets where stated) ----
model:
  d_model: 512      # SPEC starting size
  layers: 6
  heads: 8
  ffn: 2048
  dropout: 0.1      # PyTorch default for TransformerDecoderLayer
  chunk: 50         # smolvla_libero chunk_size / n_action_steps

train:
  steps: 20000      # fixed for all 6 models; plan rule: min(20000, steps in 60 min) -> confirmed by the M3+M4 run
  batch: 64
  lr: 1.0e-4        # SmolVLA optimizer preset
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip: 10.0
  warmup: 1000
  final_lr: 2.5e-6
  val_every: 1000
  val_samples: 2048

flow:
  steps: 10         # Euler steps at inference (smolvla_libero num_steps)
  beta_a: 1.5
  beta_b: 1.0

eval:
  episodes_per_task: 5   # SPEC start value; M5 rule may raise it (never lower)
  eval_seed: 1000
  n_action_steps: 50     # execute the whole chunk, then replan (smolvla_libero)
